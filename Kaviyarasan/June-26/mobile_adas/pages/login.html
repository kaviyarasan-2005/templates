<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Sign In | Nexo</title>
  <meta name="description" content="Secure sign in for the Nexo customer portal and shop management dashboard.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/utilities.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  
  <style>
    .auth-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-primary);
      padding: var(--space-8);
      position: relative;
      overflow: hidden;
    }
    
    .auth-layout::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .auth-card {
      width: 100%;
      max-width: 450px;
      z-index: 1;
    }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='22' y1='12' x2='18' y2='12'/%3E%3Cline x1='6' y1='12' x2='2' y2='12'/%3E%3Cline x1='12' y1='6' x2='12' y2='2'/%3E%3Cline x1='12' y1='22' x2='12' y2='18'/%3E%3C/svg%3E">
</head>
<body style="margin: 0;">

  <main class="auth-layout">
    <!-- Floating Theme/RTL Actions -->
    <div class="auth-actions" style="position: absolute; top: var(--space-4); right: var(--space-4); display: flex; gap: var(--space-2); z-index: 10;">
      <button class="nav-toggle-btn rtl-toggle" aria-label="Toggle RTL Mode" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); cursor: pointer; color: var(--color-text); height: 40px; display: flex; align-items: center; justify-content: center;">
        <span class="toggle-label" style="font-size: var(--text-xs); font-weight: var(--weight-bold);">RTL</span>
      </button>
      <button class="nav-toggle-btn theme-toggle" aria-label="Toggle Theme" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); cursor: pointer; color: var(--color-text); height: 40px; display: flex; align-items: center; justify-content: center;">
        <i data-lucide="moon" style="width: 18px; height: 18px;"></i>
      </button>
    </div>

    <div class="card auth-card p-8 animate-on-scroll visible">
      
      <!-- Brand Logo Header -->
      <div class="text-center mb-8">
        <a href="../index.html" class="navbar-logo justify-center mb-4" style="text-decoration: none; display: inline-flex;">
          <div class="logo-icon" style="width: 36px; height: 36px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-crosshair" style="width: 20px; height: 20px;"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
          </div>
          <span class="logo-text" style="font-size: var(--text-lg);">Nexo</span>
        </a>
        <h1 class="text-2xl font-bold">Sign In to Shop Portal</h1>
        <p class="text-text-muted text-sm mt-1">Manage calibrations, download OEM reports, and track billing.</p>
      </div>

      <!-- Auth Form -->
      <form class="validate-form flex flex-col gap-4" onsubmit="event.preventDefault(); window.location.href='user-dashboard.html';">
        <div class="form-group">
          <label for="login-email" class="form-label">Shop Email Address *</label>
          <input type="email" id="login-email" required class="form-input" placeholder="manager@shopname.com">
        </div>

        <div class="form-group">
          <div class="flex justify-between items-center mb-2">
            <label for="login-password" class="form-label mb-0" style="margin-bottom: 0;">Password *</label>
            <a href="#" onclick="alert('Password reset link sent.');" class="text-xs text-accent" style="text-decoration: none;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" required class="form-input" placeholder="••••••••">
        </div>

        <div class="flex items-center gap-2 mb-2">
          <input type="checkbox" id="remember-me" style="cursor: pointer;">
          <label for="remember-me" class="text-xs text-text-secondary" style="cursor: pointer; user-select: none;">Keep my shop session logged in</label>
        </div>

        <button type="submit" class="btn btn-primary w-full text-center">Sign In</button>
      </form>

      <div class="text-center mt-6 pt-6 border-top" style="border-top: 1px solid var(--color-border);">
        <p class="text-sm text-text-secondary">New collision center? <a href="signup.html" class="text-accent font-semibold" style="text-decoration: none;">Register account</a></p>
        <a href="../index.html" class="btn-link text-xs text-text-muted mt-4 block" style="text-decoration: none;"><i data-lucide="arrow-left" class="inline-block mr-1"></i> Back to Homepage</a>
      </div>

    </div>
  </main>

  <!-- Lucide Icons & Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
