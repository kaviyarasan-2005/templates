<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIND | Coming Soon</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="auth-layout" style="flex-direction: column; justify-content: flex-start; padding-top: var(--header-height);">

    <header class="header" style="position: absolute; top: 0; left: 0; width: 100%;">
        <div class="container header__inner">
            <a href="index.html" class="logo" aria-label="BIND Home">
                <svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="32" font-family="'Playfair Display', serif" font-size="32" font-weight="700" letter-spacing="2">BIND</text>
                </svg>
            </a>
            <div class="header__controls">
                <button class="toggle-btn js-rtl-toggle">EN / AR</button>
                <button class="toggle-btn js-theme-toggle" aria-label="Toggle Theme">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="container text-center reveal" style="max-width: 600px; margin-top: 10vh;">
        <svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto 48px; display: block; max-width: 160px;">
            <text x="0" y="32" font-family="'Playfair Display', serif" font-size="32" font-weight="700" letter-spacing="2" fill="var(--color-primary)">BIND</text>
        </svg>

        <h1 class="mb-4">Opening the Bindery Soon</h1>
        <p class="mb-6" style="font-size: 1.125rem;">Our artisans are putting the final stitches on our new collection. Leave your email to be notified when our atelier opens.</p>
        
        <!-- Countdown Placeholder -->
        <div class="flex justify-center gap-4 mb-8">
            <div class="card text-center" style="min-width: 80px; padding: 16px 8px;">
                <h2 style="margin:0; color: var(--color-accent);">14</h2>
                <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-text-secondary);">Days</span>
            </div>
            <div class="card text-center" style="min-width: 80px; padding: 16px 8px;">
                <h2 style="margin:0; color: var(--color-accent);">08</h2>
                <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-text-secondary);">Hours</span>
            </div>
            <div class="card text-center" style="min-width: 80px; padding: 16px 8px;">
                <h2 style="margin:0; color: var(--color-accent);">45</h2>
                <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--color-text-secondary);">Mins</span>
            </div>
        </div>

        <form class="flex gap-2" style="max-width: 400px; margin: 0 auto 32px;" onsubmit="event.preventDefault(); alert('Subscribed!');">
            <input type="email" class="form-input" placeholder="Enter your email address" required aria-label="Email address for launch notification">
            <button type="submit" class="btn btn--primary">Notify Me</button>
        </form>

        <div class="flex justify-center gap-4">
            <a href="#" class="social-btn" style="width: 44px; height: 44px; padding: 0; border-radius: 50%;" aria-label="Instagram">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <a href="#" class="social-btn" style="width: 44px; height: 44px; padding: 0; border-radius: 50%;" aria-label="Facebook">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
            </a>
            <a href="#" class="social-btn" style="width: 44px; height: 44px; padding: 0; border-radius: 50%;" aria-label="Twitter">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path></svg>
            </a>
        </div>
    </div>

    <!-- JS -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
