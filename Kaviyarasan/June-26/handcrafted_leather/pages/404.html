<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIND | Page Not Found</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="auth-layout" style="flex-direction: column; justify-content: flex-start; padding-top: var(--header-height);">

    <header class="header" style="position: absolute; top: 0; left: 0; width: 100%;">
        <div class="container header__inner">
            <a href="index.html" class="logo" aria-label="BIND Home">
                <svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                    <text x="0" y="32" font-family="'Playfair Display', serif" font-size="32" font-weight="700" letter-spacing="2">BIND</text>
                </svg>
            </a>
            <div class="header__controls">
                <button class="toggle-btn js-rtl-toggle">EN / AR</button>
                <button class="toggle-btn js-theme-toggle" aria-label="Toggle Theme">
                    <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="container text-center reveal" style="max-width: 600px; margin-top: 10vh;">
        <!-- Torn Page Illustration Placeholder -->
        <svg viewBox="0 0 24 24" width="120" height="120" stroke="var(--color-accent)" stroke-width="1" fill="none" style="margin: 0 auto 32px; opacity: 0.8;">
            <path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M2 13h10c1 0 1 2 2 2s1-2 2-2h6"></path>
            <text x="12" y="16" font-size="6" text-anchor="middle" font-family="var(--font-body)" font-weight="bold" stroke="none" fill="currentColor">404</text>
        </svg>

        <h1 class="mb-4">Page Not Found</h1>
        <p class="mb-6" style="font-size: 1.125rem;">Like a misplaced journal, the page you're looking for seems to be missing from our archives.</p>
        
        <div class="form-group" style="position: relative; max-width: 400px; margin: 0 auto 32px;">
            <input type="text" class="form-input" placeholder="Search the bindery..." style="padding-right: 48px;">
            <button class="btn" style="position: absolute; right: 4px; top: 4px; padding: 0 12px; height: 40px; min-height: auto; background: var(--color-bg);">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

        <div class="flex justify-center gap-3 flex-col sm:flex-row" style="flex-wrap: wrap;">
            <a href="index.html" class="btn btn--primary">Return Home</a>
            <a href="shop.html" class="btn btn--outline">Browse Shop</a>
            <a href="contact.html" class="btn btn--outline">Contact Us</a>
        </div>
    </div>

    <!-- JS -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
