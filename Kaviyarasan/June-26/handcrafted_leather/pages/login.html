<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIND | Login</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="auth-layout">

    <header class="auth-header">
        <a href="index.html" class="logo" aria-label="BIND Home">
            <svg viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="32" font-family="'Playfair Display', serif" font-size="32" font-weight="700" letter-spacing="2">BIND</text>
            </svg>
        </a>
        <div class="header__controls">
            <button class="toggle-btn js-rtl-toggle">EN / AR</button>
            <button class="toggle-btn js-theme-toggle" aria-label="Toggle Theme">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="auth-card reveal">
        <div class="text-center mb-6">
            <h2>Welcome Back</h2>
            <p>Enter your details to access your atelier account.</p>
        </div>

        <button class="social-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
        </button>
        <button class="social-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.365 14.363c0-4.041 3.303-5.669 3.455-5.759-1.879-2.73-4.808-3.111-5.856-3.156-2.5-.251-4.887 1.488-6.162 1.488-1.272 0-3.238-1.442-5.303-1.403-2.709.043-5.207 1.579-6.598 4.02-2.817 4.885-.716 12.112 2.032 16.079 1.341 1.935 2.923 4.088 5.006 4.004 2.006-.086 2.766-1.303 5.201-1.303 2.43 0 3.125 1.303 5.239 1.259 2.158-.04 3.524-1.956 4.85-3.896 1.528-2.234 2.16-4.397 2.193-4.512-.047-.02-4.225-1.616-4.257-6.821zm-3.093-9.529c1.109-1.345 1.86-3.218 1.656-5.084-1.594.064-3.535 1.066-4.686 2.451-1.026 1.233-1.921 3.136-1.674 4.965 1.782.138 3.596-.985 4.704-2.332z"/></svg>
            Continue with Apple
        </button>

        <div class="auth-divider">or log in with email</div>

        <form action="user-dashboard.html" method="GET">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-input" required placeholder="name@example.com">
                <span class="form-error">Please enter a valid email</span>
            </div>
            <div class="form-group">
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="font-size: 0.875rem;">Forgot password?</a>
                </div>
                <div class="password-input-wrap">
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                    <button type="button" class="password-toggle-btn js-toggle-password" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex items-center gap-2 mb-6">
                <input type="checkbox" id="remember">
                <label for="remember" style="font-size: 0.875rem;">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn--primary" style="width: 100%;">Log In</button>
        </form>

        <div class="text-center mt-6" style="font-size: 0.875rem;">
            Don't have an account? <a href="signup.html" style="font-weight: 500;">Sign Up</a>
        </div>
    </div>

    <!-- JS -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
